version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bio_games
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth:
    build: ./services/auth
    ports:
      - "3001:3001"
    environment:
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=password
      - PG_DATABASE=bio_games
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  matchmaking:
    build: ./services/matchmaking
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  game-logic:
    build: ./services/game-logic
    ports:
      - "3003:3003"
    environment:
      - REDIS_URL=redis://redis:6379
      - HMAC_SECRET=${HMAC_SECRET:-your_hmac_secret_here}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  economy:
    build: ./services/economy
    ports:
      - "3004:3004"
    environment:
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=password
      - PG_DATABASE=bio_games
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build: ./services/analytics
    ports:
      - "3005:3005"
    environment:
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=password
      - PG_DATABASE=bio_games
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: ./admin
    ports:
      - "3006:3006"
    environment:
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=password
      - PG_DATABASE=bio_games
      - JWT_SECRET=${ADMIN_JWT_SECRET:-admin_jwt_secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: