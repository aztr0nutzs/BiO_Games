<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chips Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .balance {
            text-align: center;
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .chips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chip-option {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .chip-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .chip-option:active {
            transform: translateY(-2px);
        }
        
        .chip-amount {
            display: block;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        .chip-price {
            display: block;
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .back-button {
            width: 100%;
            background: #333;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .back-button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Buy Chips</h1>
        
        <div class="balance">
            Current Balance: <span id="credits">0</span> Credits
        </div>
        
        <div class="chips-grid">
            <button class="chip-option" onclick="buyChips(100, 0.99)">
                <span class="chip-amount">100</span>
                <span class="chip-price">$0.99</span>
            </button>
            
            <button class="chip-option" onclick="buyChips(500, 4.99)">
                <span class="chip-amount">500</span>
                <span class="chip-price">$4.99</span>
            </button>
            
            <button class="chip-option" onclick="buyChips(1000, 8.99)">
                <span class="chip-amount">1,000</span>
                <span class="chip-price">$8.99</span>
            </button>
            
            <button class="chip-option" onclick="buyChips(2500, 19.99)">
                <span class="chip-amount">2,500</span>
                <span class="chip-price">$19.99</span>
            </button>
            
            <button class="chip-option" onclick="buyChips(5000, 34.99)">
                <span class="chip-amount">5,000</span>
                <span class="chip-price">$34.99</span>
            </button>
            
            <button class="chip-option" onclick="buyChips(10000, 59.99)">
                <span class="chip-amount">10,000</span>
                <span class="chip-price">$59.99</span>
            </button>
        </div>
        
        <button class="back-button" onclick="goBack()">← Back to Lobby</button>
    </div>
    
    <script>
        // Update credits display
        function updateCredits() {
            if (typeof BioGameJS !== 'undefined') {
                const credits = BioGameJS.getCredits();
                document.getElementById('credits').textContent = credits.toLocaleString();
            }
        }
        
        // Buy chips
        function buyChips(amount, price) {
            if (confirm(`Purchase ${amount.toLocaleString()} chips for $${price}?`)) {
                // In production, this would trigger actual payment processing
                if (typeof BioGameJS !== 'undefined') {
                    BioGameJS.addCredits(amount);
                    updateCredits();
                    alert(`Successfully purchased ${amount.toLocaleString()} chips!`);
                }
            }
        }
        
        // Go back to lobby
        function goBack() {
            if (typeof BioGameJS !== 'undefined') {
                BioGameJS.goBackToLobby();
            } else {
                window.history.back();
            }
        }
        
        // Initialize
        window.addEventListener('load', function() {
            updateCredits();
        });
    </script>
</body>
</html>
