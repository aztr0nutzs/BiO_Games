<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KnXT 4 | Ultimate Bio-Protocol</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   CORE VARIABLES & PALETTE
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg-dark: #020203;
  --glass: rgba(10, 14, 20, 0.75);
  --glass-border: rgba(255, 255, 255, 0.1);
  
  --toxic: #22ff9a;
  --teal:  #00f0ff; /* Updated to match uploaded script neon */
  --amber: #ffb14a;
  --mag:   #ff00ff;
  
  --cell-size: min(11vw, 76px); /* Zoomed In */
  --gap: 12px;
}

* { box-sizing: border-box; user-select: none; }

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-dark);
  color: #fff;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ═══════════════════════════════════════════════════════════════
   THREE.JS BACKGROUND LAYER
   ═══════════════════════════════════════════════════════════════ */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   UI: HEADERS & MENUS
   ═══════════════════════════════════════════════════════════════ */
.ui-layer {
  position: absolute;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Top Bar */
.top-bar {
  pointer-events: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
  border-bottom: 1px solid rgba(0, 240, 255, 0.2);
}

.brand {
  display: flex;
  flex-direction: column;
}
.brand h1 {
  margin: 0;
  font-size: 24px;
  color: var(--teal);
  text-shadow: 0 0 10px var(--teal);
  letter-spacing: 4px;
}
.brand span { font-size: 10px; color: #888; letter-spacing: 2px; }

.menu-group {
  display: flex;
  gap: 20px;
}

.btn-ui {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--glass-border);
  color: var(--teal);
  padding: 8px 16px;
  font-family: inherit;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  backdrop-filter: blur(4px);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.btn-ui:hover {
  background: rgba(0, 240, 255, 0.15);
  box-shadow: 0 0 15px var(--teal);
  border-color: var(--teal);
}
.btn-ui.active {
  background: var(--teal);
  color: #000;
  box-shadow: 0 0 20px var(--teal);
}

/* Side Panel (Chat/Log) */
.side-panel {
  pointer-events: auto;
  position: absolute;
  right: 20px;
  top: 100px;
  width: 260px;
  height: 400px;
  background: rgba(5, 7, 10, 0.85);
  border: 1px solid rgba(0, 240, 255, 0.1);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  transform: translateX(120%); /* Hidden by default */
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.side-panel.open { transform: translateX(0); }

.panel-header {
  padding: 10px;
  background: rgba(0, 240, 255, 0.05);
  border-bottom: 1px solid rgba(0, 240, 255, 0.1);
  font-size: 12px;
  color: var(--teal);
}
.log-content {
  flex: 1;
  padding: 10px;
  font-size: 10px;
  color: #aaa;
  overflow-y: auto;
  font-family: monospace;
}
.log-line { margin-bottom: 5px; border-left: 2px solid #333; padding-left: 8px; }
.log-line.p1 { border-color: var(--teal); color: #fff; }
.log-line.p2 { border-color: var(--toxic); color: #fff; }

/* SVG Tracery Animation (Adapted from style.css) */
.panel-border-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.path-anim {
  fill: none;
  stroke: var(--teal);
  stroke-width: 1;
  stroke-dasharray: 200;
  stroke-dashoffset: 200;
  animation: draw 4s infinite linear;
  opacity: 0.5;
}
@keyframes draw { 
  0% { stroke-dashoffset: 200; opacity: 0; } 
  50% { opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; } 
}

/* ═══════════════════════════════════════════════════════════════
   3D STAGE & BOARD (Updated Angle)
   ═══════════════════════════════════════════════════════════════ */
.stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1000px; /* Stronger perspective */
  z-index: 10;
}

.board-container {
  position: relative;
  transform-style: preserve-3d;
  /* Straightened angle, zoomed in */
  transform: scale(1.15) rotateX(5deg) rotateY(0deg) translateZ(0px);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Board Shake Effect */
.shake { animation: boardShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes boardShake {
  10%, 90% { transform: scale(1.15) rotateX(5deg) translate3d(-1px, 1px, 0); }
  20%, 80% { transform: scale(1.15) rotateX(5deg) translate3d(2px, -1px, 0); }
  30%, 50%, 70% { transform: scale(1.15) rotateX(5deg) translate3d(-3px, 0px, 0); }
  40%, 60% { transform: scale(1.15) rotateX(5deg) translate3d(3px, 1px, 0); }
}

.board-mesh {
  display: grid;
  grid-template-columns: repeat(7, var(--cell-size));
  grid-template-rows: repeat(6, var(--cell-size));
  gap: var(--gap);
  padding: 20px;
  border-radius: 12px;
  transform-style: preserve-3d;
  
  /* High fidelity material */
  background: 
    linear-gradient(135deg, #1a1c24 0%, #0d0f14 100%),
    repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 2px, transparent 10px);
  
  box-shadow: 
    0 20px 50px rgba(0,0,0,0.8),
    inset 0 0 0 1px rgba(255,255,255,0.1),
    inset 0 0 40px rgba(0,0,0,0.8);
    
  border: 1px solid rgba(255,255,255,0.08);
}

/* ═══════════════════════════════════════════════════════════════
   HYPER-REAL LIQUID TUBES
   ═══════════════════════════════════════════════════════════════ */
.tube-system {
  position: absolute;
  top: 0; bottom: -100px;
  width: 100%;
  pointer-events: none;
  transform-style: preserve-3d;
  z-index: -1;
}
.tube {
  position: absolute;
  top: 10px; bottom: 0;
  width: 50px;
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(0, 240, 255, 0.1);
  overflow: hidden;
  backdrop-filter: blur(2px);
  transform: translateZ(-20px);
}
.tube.left { left: -70px; }
.tube.right { right: -70px; }

/* Animated Liquid layers */
.liquid-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 85%;
  background: linear-gradient(to bottom, var(--toxic), var(--teal));
  opacity: 0.7;
  filter: drop-shadow(0 0 10px var(--toxic));
}
.liquid-surface {
  position: absolute;
  top: 15%; /* Corresponds to 85% height */
  left: -50%; right: -50%;
  height: 20px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  animation: liquidWobble 3s ease-in-out infinite;
}

/* Bubbles */
.bubble {
  position: absolute;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
  border-radius: 50%;
  animation: rise 4s infinite linear;
  bottom: -20px;
}
@keyframes rise {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-600px) scale(1.2); opacity: 0; }
}
@keyframes liquidWobble {
  0%, 100% { transform: scaleX(1) rotate(0deg); }
  50% { transform: scaleX(0.9) rotate(5deg); }
}

/* ═══════════════════════════════════════════════════════════════
   GAME PIECES (Updated Materials)
   ═══════════════════════════════════════════════════════════════ */
.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle, #000 40%, #1a1a1a 70%);
  box-shadow: inset 0 5px 10px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
  cursor: pointer;
  z-index: 20;
}
.cell:hover { box-shadow: 0 0 15px var(--teal), inset 0 0 20px #000; }

.chip {
  position: absolute; inset: 2px;
  border-radius: 50%;
  transform-style: preserve-3d;
  animation: dropIn 0.5s cubic-bezier(0.5, 0, 0.5, 1.2) forwards;
}
.chip.p1 {
  background: radial-gradient(circle at 30% 30%, #fff 0%, var(--teal) 20%, #005f6b 100%);
  box-shadow: 0 0 20px var(--teal);
}
.chip.p2 {
  background: radial-gradient(circle at 30% 30%, #fff 0%, var(--toxic) 20%, #006b3f 100%);
  box-shadow: 0 0 20px var(--toxic);
}
.chip::before { /* Thickness */
  content: ''; position: absolute; inset:0; border-radius: 50%;
  transform: translateZ(-8px);
  background: inherit; filter: brightness(0.6);
}

@keyframes dropIn {
  from { transform: translateY(-600px) rotateX(45deg); }
  to { transform: translateY(0) rotateX(0deg); }
}

/* ═══════════════════════════════════════════════════════════════
   HUD STATS (Bottom)
   ═══════════════════════════════════════════════════════════════ */
.stats-bar {
  position: absolute;
  bottom: 30px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 40px;
  pointer-events: none;
  z-index: 100;
}
.stat-card {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 15px 30px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  text-align: center;
  min-width: 140px;
  transition: transform 0.3s;
}
.stat-card.active {
  transform: scale(1.1);
  border-color: var(--teal);
  box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
}
.stat-card.p2-active {
  border-color: var(--toxic);
  box-shadow: 0 0 25px rgba(34, 255, 154, 0.2);
}
.stat-label { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
.stat-val { font-size: 24px; font-weight: bold; margin-top: 5px; }

</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
</script>
</head>
<body>

<canvas id="bg"></canvas>

<div class="ui-layer">
  <div class="top-bar">
    <div class="brand">
      <h1>KnXT 4</h1>
      <span>ULTIMATE PROTOCOL</span>
    </div>
    <div class="menu-group">
      <button class="btn-ui" onclick="toggleMenu('multiplayer')">MULTIPLAYER: OFF</button>
      <button class="btn-ui" onclick="toggleMenu('settings')">SETTINGS</button>
      <button class="btn-ui" onclick="game.reset()">RESET SYSTEM</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card" id="cardP1">
      <div class="stat-label">OPERATOR A</div>
      <div class="stat-val" id="score1" style="color: var(--teal)">0</div>
    </div>
    <div class="stat-card" id="cardP2">
      <div class="stat-label">OPERATOR X</div>
      <div class="stat-val" id="score2" style="color: var(--toxic)">0</div>
    </div>
  </div>
  
  <div class="side-panel" id="sidePanel">
    <svg class="panel-border-svg" viewBox="0 0 260 400">
       <rect x="1" y="1" width="258" height="398" rx="0" class="path-anim" />
    </svg>
    <div class="panel-header">SYSTEM LOG // LIVE FEED</div>
    <div class="log-content" id="gameLog">
      <div class="log-line">>> SYSTEM INITIALIZED</div>
      <div class="log-line">>> BIO-LAB ENVIRONMENT LOADED</div>
      <div class="log-line">>> WAITING FOR INPUT...</div>
    </div>
  </div>
</div>

<main class="stage">
  <div class="board-container" id="boardContainer">
    
    <div class="tube-system">
      <div class="tube left">
        <div class="liquid-fill"></div>
        <div class="liquid-surface"></div>
        </div>
      <div class="tube right">
        <div class="liquid-fill" style="background: linear-gradient(to bottom, #ffb14a, #ff00ff)"></div>
        <div class="liquid-surface"></div>
      </div>
    </div>

    <div class="board-mesh" id="grid">
      </div>

  </div>
</main>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   THREE.JS VISUAL ENGINE (Adapted from uploaded script.js)
   ═══════════════════════════════════════════════════════════════ */
import * as THREE from 'three';

// Setup
const canvas = document.getElementById('bg');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020203, 0.02); // Darker fog for KnXT theme

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1, 8); // Lower angle

// Lights
const hemi = new THREE.HemisphereLight(0x202038, 0x001020, 0.6);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.5);
dir.position.set(5, 10, 5);
scene.add(dir);

// Neon Light (The "Mutation Node" glow source)
const neonLight = new THREE.PointLight(0x00f0ff, 2, 50);
neonLight.position.set(0, 0, 2);
scene.add(neonLight);

// Particles
const particleCount = 1000;
const posArray = new Float32Array(particleCount * 3);
for(let i=0; i<particleCount * 3; i++) {
  posArray[i] = (Math.random() - 0.5) * 50;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x00f0ff,
  size: 0.05,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Lightning Effect (from uploaded script)
const lightningGroup = new THREE.Group();
scene.add(lightningGroup);

function spawnLightning() {
  if(Math.random() > 0.03) return; // Low chance
  
  const x = (Math.random() - 0.5) * 20;
  const z = -10 + (Math.random() - 0.5) * 10;
  
  const points = [];
  let curY = 10;
  let curX = x;
  while(curY > -5) {
    points.push(new THREE.Vector3(curX, curY, z));
    curY -= Math.random() * 2;
    curX += (Math.random() - 0.5) * 1.5;
  }
  
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: 0x00f0ff, opacity: 0.8, transparent: true });
  const line = new THREE.Line(geo, mat);
  lightningGroup.add(line);
  
  // Quick fade
  setTimeout(() => {
    lightningGroup.remove(line);
    geo.dispose();
    mat.dispose();
  }, 100);
}

// Animation Loop
function animate() {
  requestAnimationFrame(animate);
  
  // Gentle particle float
  particles.rotation.y += 0.0005;
  const positions = pGeo.attributes.position.array;
  for(let i=1; i<particleCount*3; i+=3) {
    positions[i] += 0.01;
    if(positions[i] > 20) positions[i] = -20;
  }
  pGeo.attributes.position.needsUpdate = true;

  spawnLightning();
  
  // Dynamic light color based on turn
  const time = performance.now() * 0.001;
  if(window.gameInstance && window.gameInstance.turn === 2) {
    neonLight.color.lerp(new THREE.Color(0x22ff9a), 0.05);
  } else {
    neonLight.color.lerp(new THREE.Color(0x00f0ff), 0.05);
  }

  renderer.render(scene, camera);
}
animate();

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

<script>
class KnxtGame {
  constructor() {
    this.rows = 6;
    this.cols = 7;
    this.board = [];
    this.turn = 1; // 1 = Teal, 2 = Toxic Green
    this.scores = [0, 0];
    this.active = true;
    this.initDOM();
    this.reset();
    
    // Global ref for Three.js access
    window.gameInstance = this;
    
    // Bubbles
    this.spawnBubbles();
    
    // Open Log panel
    setTimeout(() => document.getElementById('sidePanel').classList.add('open'), 500);
  }

  initDOM() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.c = c;
        cell.onclick = () => this.move(c);
        grid.appendChild(cell);
      }
    }
  }
  
  spawnBubbles() {
    const tubes = document.querySelectorAll('.tube');
    tubes.forEach(tube => {
      setInterval(() => {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 5 + Math.random() * 8;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (10 + Math.random() * 80) + '%';
        b.style.animationDuration = (2 + Math.random() * 3) + 's';
        tube.appendChild(b);
        setTimeout(() => b.remove(), 5000);
      }, 400);
    });
  }

  reset() {
    this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
    this.turn = 1;
    this.active = true;
    document.querySelectorAll('.chip').forEach(c => c.remove());
    this.log(">> SYSTEM RESET. READY.");
    this.updateHUD();
  }

  move(col) {
    if (!this.active) return;
    
    // Find row
    let row = -1;
    for (let r = this.rows - 1; r >= 0; r--) {
      if (this.board[r][col] === 0) {
        row = r;
        break;
      }
    }
    if (row === -1) return; // Col full

    // Update state
    this.board[row][col] = this.turn;
    
    // Visuals
    this.addChip(row, col);
    this.shakeBoard();
    this.log(`>> OP_${this.turn === 1 ? 'A' : 'X'} DROP: [${col},${row}]`);

    // Win check
    if (this.checkWin(row, col)) {
      this.active = false;
      this.scores[this.turn - 1]++;
      this.log(`>> WIN DETECTED: OPERATOR ${this.turn === 1 ? 'A' : 'X'}`);
      this.log(">> INITIATING RESET SEQUENCE...");
      setTimeout(() => this.reset(), 2000);
    } else {
      this.turn = this.turn === 1 ? 2 : 1;
      this.updateHUD();
      
      // Simple AI
      if(this.turn === 2) {
        setTimeout(() => {
          const valid = [];
          for(let c=0; c<7; c++) if(this.board[0][c]===0) valid.push(c);
          if(valid.length) this.move(valid[Math.floor(Math.random()*valid.length)]);
        }, 600);
      }
    }
  }

  addChip(r, c) {
    const grid = document.getElementById('grid');
    const index = r * this.cols + c;
    const cell = grid.children[index];
    const chip = document.createElement('div');
    chip.className = `chip p${this.turn}`;
    cell.appendChild(chip);
  }
  
  shakeBoard() {
    const b = document.getElementById('boardContainer');
    b.classList.remove('shake');
    void b.offsetWidth;
    b.classList.add('shake');
  }

  checkWin(r, c) {
    const p = this.board[r][c];
    const dirs = [[0,1], [1,0], [1,1], [1,-1]];
    for(let [dr, dc] of dirs) {
      let count = 1;
      for(let i=1; i<4; i++) {
        let nr = r + dr*i, nc = c + dc*i;
        if(nr<0||nr>=this.rows||nc<0||nc>=this.cols||this.board[nr][nc]!==p) break;
        count++;
      }
      for(let i=1; i<4; i++) {
        let nr = r - dr*i, nc = c - dc*i;
        if(nr<0||nr>=this.rows||nc<0||nc>=this.cols||this.board[nr][nc]!==p) break;
        count++;
      }
      if(count >= 4) return true;
    }
    return false;
  }

  updateHUD() {
    const c1 = document.getElementById('cardP1');
    const c2 = document.getElementById('cardP2');
    c1.classList.toggle('active', this.turn === 1);
    c2.classList.toggle('active', false);
    c2.classList.toggle('p2-active', this.turn === 2);
    
    document.getElementById('score1').innerText = this.scores[0];
    document.getElementById('score2').innerText = this.scores[1];
  }
  
  log(msg) {
    const box = document.getElementById('gameLog');
    const line = document.createElement('div');
    line.className = `log-line ${this.turn === 1 ? 'p1' : 'p2'}`;
    line.innerText = msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }
}

// Init
const game = new KnxtGame();

// Global Menu Toggles
window.toggleMenu = function(type) {
  if(type === 'multiplayer') {
     const btn = event.target;
     if(btn.innerText.includes('OFF')) {
       btn.innerText = 'MULTIPLAYER: SEARCHING...';
       btn.classList.add('active');
       game.log(">> NETWORK SCAN INITIATED...");
       setTimeout(() => {
          btn.innerText = 'MULTIPLAYER: ERROR (OFFLINE)';
          btn.classList.remove('active');
          game.log(">> CONNECTION FAILED. LOCAL MODE ACTIVE.");
       }, 2000);
     } else {
       btn.innerText = 'MULTIPLAYER: OFF';
       btn.classList.remove('active');
     }
  }
  if(type === 'settings') {
