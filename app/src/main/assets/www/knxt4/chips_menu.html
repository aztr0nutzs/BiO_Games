<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chips Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            color: #00ff00;
        }
        #chips-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 10px #00ff00;
            z-index: 1000;
        }
        .chip {
            width: 50px;
            height: 50px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .chip:hover {
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        .chip.selected {
            border-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
        }
        @media (max-width: 600px) {
            .chip {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div id="chips-menu">
        <img src="../assets/knxt4_chips/chip01.png" alt="Chip s03" class="chip" data-chip="s03">
        <img src="../assets/knxt4_chips/chip02.png" alt="Chip s04" class="chip" data-chip="s04">
        <img src="../assets/knxt4_chips/chip03.png" alt="Chip s06" class="chip" data-chip="s06">
        <img src="../assets/knxt4_chips/chip04.png" alt="Chip s09" class="chip" data-chip="s09">
        <img src="../assets/knxt4_chips/chip05.png" alt="Chip s11" class="chip" data-chip="s11">
        <img src="../assets/knxt4_chips/chip06.png" alt="Chip s14" class="chip" data-chip="s14">
        <img src="../assets/knxt4_chips/s21.png" alt="Chip s21" class="chip" data-chip="s21">
        <img src="../assets/knxt4_chips/s28.jpeg" alt="Chip s28" class="chip" data-chip="s28">
        <img src="../assets/knxt4_chips/s29.jpeg" alt="Chip s29" class="chip" data-chip="s29">
        <img src="../assets/knxt4_chips/s30.jpeg" alt="Chip s30" class="chip" data-chip="s30">
        <img src="../assets/knxt4_chips/s31.jpeg" alt="Chip s31" class="chip" data-chip="s31">
        <img src="../assets/knxt4_chips/s32.jpeg" alt="Chip s32" class="chip" data-chip="s32">
        <img src="../assets/knxt4_chips/s33.jpeg" alt="Chip s33" class="chip" data-chip="s33">
        <img src="../assets/knxt4_chips/s34.jpeg" alt="Chip s34" class="chip" data-chip="s34">
        <img src="../assets/knxt4_chips/s35.jpeg" alt="Chip s35" class="chip" data-chip="s35">
        <img src="../assets/knxt4_chips/s36.jpeg" alt="Chip s36" class="chip" data-chip="s36">
        <img src="../assets/knxt4_chips/s37.jpeg" alt="Chip s37" class="chip" data-chip="s37">
    </div>

    <script>
        let selectedChip = null;

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                // Remove selected class from all chips
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
                
                // Add selected class to clicked chip
                this.classList.add('selected');
                
                // Store selected chip
                selectedChip = this.dataset.chip;
                
                // Optional: Log or send to bridge
                console.log('Selected chip:', selectedChip);
                // If bridge exists: window.BioGameJS.selectChip(selectedChip);
            });
        });
    </script>
</body>
</html>
