<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#03060c;color:#00eaff;font-family:monospace;overflow:hidden}
.scan{position:absolute;width:100%;height:2px;background:#00eaff66;animation:scan 2.5s linear infinite}
@keyframes scan{from{top:-2px}to{top:100%}}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.box{border:1px solid #00eaff66;padding:24px;box-shadow:0 0 30px #00eaff33}
.bar{height:6px;background:#00ffaa;width:0;animation:load 2.2s forwards;margin-top:12px}
@keyframes load{to{width:100%}}
</style>
</head>
<body>
<div class="scan"></div>
<div class="center">
  <div class="box">
    <div>INITIALIZING BIOGAMES SYSTEM</div>
    <div class="bar"></div>
  </div>
</div>
<audio id="boot" src="boot.wav"></audio>
<script>
document.getElementById('boot').play().catch(()=>{});
setTimeout(()=>location.href='bio_lobby3.html',2600);
</script>
</body>
</html>
