<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chip Inventory System</title>
  <style>
    /* ●○◆◇☆◎ MYSTICAL ARCANE PALETTE ◎☆◇◆○● */
    :root {
      --bg-main: #1e1a29;
      --bg-secondary: #2a1f3e; 
      --bg-content: #352a50;
      --bg-slot: #433366;
      --bg-slot-hover: #57468a;
      --border-color: #8b55cd;
      --text-primary: #d8c2ff;
      --text-secondary: #a99bd2;
      --text-highlight: #ffd2ff;
      --crystal-glow: #c355ff;
      --scrollbar-thumb: #8b55cd;
      --scrollbar-track: #2a1f3e;
    }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: "MS Sans Serif", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    /* ●○◆◇☆◎ TOP OPTIONS MENU ◎☆◇◆○● */
    .top-options-menu {
      width: 520px;
      border: 3px ridge var(--border-color);
      background-color: var(--bg-secondary);
      box-shadow: 0 0 15px rgba(139, 85, 205, 0.3);
    }

    .options-grid {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      gap: 10px;
    }

    .option-node {
      background-color: var(--bg-slot);
      border: 1px solid var(--border-color);
      padding: 5px 15px;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .option-node:hover {
      background-color: var(--bg-slot-hover);
      color: var(--text-highlight);
      box-shadow: 0 0 5px var(--crystal-glow);
    }

    /* ●○◆◇☆◎ MAIN VIEWPORT ◎☆◇◆○● */
    .arcane-container {
      width: 520px; /* Widened to accommodate chip grid */
      border: 3px ridge var(--border-color);
      background-color: var(--bg-main);
      box-shadow: 0 0 15px rgba(139, 85, 205, 0.5);
    }
    
    .arcane-titlebar {
      background: linear-gradient(to right, #4a3377, #372a50);
      border-bottom: 2px ridge var(--border-color);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .arcane-title {
      font-weight: bold;
      font-size: 14px;
      margin: 0;
      color: var(--text-highlight);
      text-shadow: 1px 1px 2px rgba(195, 85, 255, 0.8);
    }
    
    .crystal-button {
      width: 18px;
      height: 18px;
      border: 1px solid #000;
      background-color: var(--bg-slot);
      margin-left: 4px;
      box-shadow: 1px 1px 0 #57468a inset, -1px -1px 0 #2a1f3e inset;
      text-align: center;
      line-height: 16px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-highlight);
    }
    
    .arcane-content {
      background-color: var(--bg-secondary);
      padding: 5px;
    }
    
    .crystal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 5px;
    }
    
    .crystal-tab {
      padding: 4px 12px;
      margin-right: 2px;
      background-color: var(--bg-content);
      border: 1px solid var(--bg-secondary);
      border-bottom: none;
      font-size: 11px;
      cursor: pointer;
    }
    
    .crystal-tab.active {
      background-color: var(--bg-slot);
      font-weight: bold;
      border: 1px solid var(--border-color);
      border-bottom: 1px solid var(--bg-slot);
      margin-bottom: -1px;
    }
    
    .crystal-viewport {
      height: 350px;
      overflow-y: auto;
      background-color: var(--bg-content);
      border: 1px solid var(--border-color);
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    
    .arcane-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    
    .chip-crystal {
      background-color: var(--bg-slot);
      border: 1px solid var(--border-color);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .chip-crystal:hover {
      background-color: var(--bg-slot-hover);
      box-shadow: 0 0 10px var(--crystal-glow);
    }
    
    .chip-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 3px var(--crystal-glow));
    }
    
    .chip-name {
      font-size: 11px;
      margin-top: 5px;
      color: var(--text-primary);
    }
    
    .arcane-statusbar {
      display: flex;
      justify-content: space-between;
      padding: 4px 10px;
      font-size: 11px;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="top-options-menu">
    <div class="arcane-titlebar">
      <h2 class="arcane-title">✦ Chip Configurations ✦</h2>
    </div>
    <div class="options-grid">
      <div class="option-node">Auto-Sort</div>
      <div class="option-node">Upgrade All</div>
      <div class="option-node">Forge</div>
      <div class="option-node">Market</div>
    </div>
  </div>

  <div class="arcane-container">
    <div class="arcane-titlebar">
      <h2 class="arcane-title">✦ Data Chip Repository ✦</h2>
      <div class="crystal-controls">
        <div class="crystal-button">_</div>
        <div class="crystal-button">×</div>
      </div>
    </div>
    
    <div class="arcane-content">
      <div class="crystal-tabs">
        <div class="crystal-tab active">Standard</div>
        <div class="crystal-tab">Elite</div>
        <div class="crystal-tab">Corrupted</div>
      </div>
      
      <div class="crystal-viewport">
        <div class="arcane-grid">
          <div class="chip-crystal">
            <img class="chip-img" src="assets/s21.jpeg" alt="S21">
            <div class="chip-name">CHIP-S21</div>
          </div>
          <div class="chip-crystal">
            <img class="chip-img" src="assets/s21.png" alt="S21">
            <div class="chip-name">CHIP-S21-P</div>
          </div>
          <div class="chip-crystal">
            <img class="chip-img" src="assets/s31.jpeg" alt="S31">
            <div class="chip-name">CHIP-S31</div>
          </div>
          <div class="chip-crystal">
            <img class="chip-img" src="assets/s31.jpeg" alt="S31">
            <div class="chip-name">CHIP-S31-B</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="arcane-statusbar">
      <span>4 Modules detected</span>
      <span>Sync: 100%</span>
    </div>
  </div>

</body>
</html>
